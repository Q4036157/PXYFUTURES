[project]
name = "pxy-futures-backend"
version = "0.1.0"
description = "貔貅元智能期货多周期均线看板"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "tqsdk>=3.10",
    "websockets==13.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.6", "pyinstaller>=6.0,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
